<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #0073e6;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
            border-radius: 5px;
        }
        main {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            background: #0073e6;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 3px;
        }
        .btn:hover {
            background: #005bb5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a sample HTML template containing standard elements like headings, paragraphs, lists, and links.</p>

        <h3>Features</h3>
        <ul>
            <li>Clean and semantic structure</li>
            <li>Embedded CSS for quick styling</li>
            <li>Responsive viewport meta tag</li>
        </ul>

        <a href="#" class="btn">Click Me</a>
    </main>

    <footer>
        <p>&copy; 2026 Sample Webpage</p>
    </footer>

</body>
</html>
